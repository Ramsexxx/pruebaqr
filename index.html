<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tarjeta AR</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }

    #loading {
      position: fixed; inset: 0;
      background: #000; color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: sans-serif; gap: 14px;
      z-index: 99;
      transition: opacity 0.5s;
    }
    #loading p  { font-size: 15px; opacity: 0.7; margin: 0; }
    #loading h2 { font-size: 20px; font-weight: 600; margin: 0; }

    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hint {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      font-family: sans-serif; font-size: 14px; color: #fff;
      background: rgba(0,0,0,0.55);
      padding: 10px 20px; border-radius: 20px;
      display: none; white-space: nowrap;
      z-index: 10;
    }

    #container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <h2>Mi Tarjeta AR</h2>
    <p>Iniciando cámara...</p>
  </div>

  <div id="hint">📸 Apunta la cámara a la tarjeta</div>

  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-image-three';

    const mindarThree = new MindARThree({
      container: document.querySelector('#container'),

      // ── TARGET IMAGE ────────────────────────────────────────────────
      // Ejemplo oficial de MindAR. Imagen para probar:
      // https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png
      //
      // Cuando tengas tu tarjeta lista:
      // 1. Compila en https://hiukim.github.io/mind-ar-js-doc/tools/compile
      // 2. Sube el targets.mind al repo
      // 3. Cambia esta línea por: imageTargetSrc: 'targets.mind'
      imageTargetSrc: 'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind',
      // ────────────────────────────────────────────────────────────────
    });

    const { renderer, scene, camera } = mindarThree;
    const anchor = mindarThree.addAnchor(0);

    // ── MODELO 3D ────────────────────────────────────────────────────
    const loader = new GLTFLoader();
    loader.load(
      'scene.glb',
      (gltf) => {
        const model = gltf.scene;

        // Ajusta escala según el tamaño de tu modelo
        // 1.0 = cubre toda la tarjeta aprox. Sube o baja este valor
        model.scale.set(0.08, 0.08, 0.08);
        model.position.set(0, 0, 0.05);

        anchor.group.add(model);

        // Reproduce todas las animaciones del .glb en loop
        const mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => {
          mixer.clipAction(clip).play();
        });

        const clock = new THREE.Clock();
        renderer.setAnimationLoop(() => {
          mixer.update(clock.getDelta());
          renderer.render(scene, camera);
        });
      },
      undefined,
      (err) => {
        console.error('Error al cargar el modelo:', err);
      }
    );
    // ─────────────────────────────────────────────────────────────────

    // Arrancar MindAR
    mindarThree.start().then(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('hint').style.display = 'block';
    }).catch((err) => {
      console.error('Error al iniciar MindAR:', err);
      document.querySelector('#loading p').textContent = 'Error: ' + err.message;
    });

  </script>

</body>
</html>
