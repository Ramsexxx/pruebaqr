<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tarjeta AR</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }

    #loading {
      position: fixed; inset: 0;
      background: #000; color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: sans-serif; gap: 14px;
      z-index: 99;
    }
    #loading p  { font-size: 15px; opacity: 0.7; margin: 0; }
    #loading h2 { font-size: 20px; font-weight: 600; margin: 0; }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hint {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      font-family: sans-serif; font-size: 14px; color: #fff;
      background: rgba(0,0,0,0.55);
      padding: 10px 20px; border-radius: 20px;
      display: none; white-space: nowrap;
      z-index: 10;
    }

    /* Sliders de ajuste */
    #controls {
      position: fixed; top: 16px; right: 16px;
      display: none;
      flex-direction: column; gap: 6px;
      z-index: 20; font-family: sans-serif;
      background: rgba(0,0,0,0.6);
      padding: 10px 14px; border-radius: 12px;
    }
    #controls label { color: #fff; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
    #controls span  { color: #0f0; font-weight: bold; min-width: 44px; text-align: right; }
    #controls input { width: 110px; }

    #container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <h2>Mi Tarjeta AR</h2>
    <p>Iniciando cámara...</p>
  </div>

  <div id="hint">📸 Apunta la cámara a la tarjeta</div>

  <div id="controls">
    <label>Escala <span id="scaleVal">0.08</span><input type="range" id="scaleSlider" min="0.001" max="2" step="0.001" value="0.08"></label>
    <label>Pos X  <span id="posXVal">0.00</span><input type="range" id="posXSlider" min="-1" max="1" step="0.01" value="0"></label>
    <label>Pos Y  <span id="posYVal">0.00</span><input type="range" id="posYSlider" min="-1" max="1" step="0.01" value="0"></label>
    <label>Pos Z  <span id="posZVal">0.05</span><input type="range" id="posZSlider" min="-1" max="1" step="0.01" value="0.05"></label>
    <label>Rot X  <span id="rotXVal">0°</span><input type="range" id="rotXSlider" min="-180" max="180" step="1" value="0"></label>
    <label>Rot Z  <span id="rotZVal">0°</span><input type="range" id="rotZSlider" min="-180" max="180" step="1" value="0"></label>
  </div>

  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-image-three';

    // ── Anti-vibración ───────────────────────────────────────────────
    const mindarThree = new MindARThree({
      container: document.querySelector('#container'),
      imageTargetSrc: 'targets.mind?v=2',  // ← incrementa v= cada vez que subas un .mind nuevo
      filterMinCF: 0.001,
      filterBeta: 1000,
    });
    // ────────────────────────────────────────────────────────────────

    const { renderer, scene, camera } = mindarThree;
    const anchor = mindarThree.addAnchor(0);

    const loader = new GLTFLoader();
    loader.load(
      'MimicruFest.glb',
      (gltf) => {
        const model = gltf.scene;
        model.scale.set(0.08, 0.08, 0.08);
        model.position.set(0, 0, 0.05);
        anchor.group.add(model);

        const mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => mixer.clipAction(clip).play());

        const clock = new THREE.Clock();
        renderer.setAnimationLoop(() => {
          mixer.update(clock.getDelta());
          renderer.render(scene, camera);
        });

        // Mostrar controles
        document.getElementById('controls').style.display = 'flex';

        // Escala
        document.getElementById('scaleSlider').addEventListener('input', (e) => {
          const v = parseFloat(e.target.value);
          document.getElementById('scaleVal').textContent = v.toFixed(3);
          model.scale.set(v, v, v);
        });

        // Posición X
        document.getElementById('posXSlider').addEventListener('input', (e) => {
          const v = parseFloat(e.target.value);
          document.getElementById('posXVal').textContent = v.toFixed(2);
          model.position.x = v;
        });

        // Posición Y
        document.getElementById('posYSlider').addEventListener('input', (e) => {
          const v = parseFloat(e.target.value);
          document.getElementById('posYVal').textContent = v.toFixed(2);
          model.position.y = v;
        });

        // Posición Z
        document.getElementById('posZSlider').addEventListener('input', (e) => {
          const v = parseFloat(e.target.value);
          document.getElementById('posZVal').textContent = v.toFixed(2);
          model.position.z = v;
        });

        // Rotación X
        document.getElementById('rotXSlider').addEventListener('input', (e) => {
          const deg = parseInt(e.target.value);
          document.getElementById('rotXVal').textContent = deg + '°';
          model.rotation.x = deg * Math.PI / 180;
        });

        // Rotación Z
        document.getElementById('rotZSlider').addEventListener('input', (e) => {
          const deg = parseInt(e.target.value);
          document.getElementById('rotZVal').textContent = deg + '°';
          model.rotation.z = deg * Math.PI / 180;
        });
      },
      undefined,
      (err) => console.error('Error al cargar el modelo:', err)
    );

    mindarThree.start().then(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('hint').style.display = 'block';
    }).catch((err) => {
      document.querySelector('#loading p').textContent = 'Error: ' + err.message;
    });

  </script>

</body>
</html>
