<!DOCTYPE html>
<html lang="es">
<head>
    <title>Mi Tarjeta AR</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #f0f0f0; }
        model-viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <model-viewer 
        src="scene.glb" 
        ar 
    ar-scale="auto" 
    ar-placement="floor"
    camera-controls 
    touch-action="pan-y">
        
        
        <button slot="ar-button" style="background-color: white; border-radius: 8px; border: none; position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); padding: 15px 25px; font-size: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            👋 Ver en mi espacio
        </button>
    </model-viewer>

</body>
</html>
