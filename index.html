<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tarjeta AR</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }

    #loading {
      position: fixed; inset: 0;
      background: #000; color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: sans-serif; gap: 14px;
      z-index: 99;
    }
    #loading p  { font-size: 15px; opacity: 0.7; margin: 0; }
    #loading h2 { font-size: 20px; font-weight: 600; margin: 0; }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hint {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      font-family: sans-serif; font-size: 14px; color: #fff;
      background: rgba(0,0,0,0.55);
      padding: 10px 20px; border-radius: 20px;
      display: none; white-space: nowrap;
      z-index: 10;
    }

    /* Controles de escala para calibrar en vivo */
    #controls {
      position: fixed; top: 16px; right: 16px;
      display: none;
      flex-direction: column; gap: 8px;
      z-index: 20; font-family: sans-serif;
    }
    #controls label { color: #fff; font-size: 12px; }
    #controls input  { width: 120px; }
    #scaleVal { color: #0f0; font-weight: bold; }

    #container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <h2>Mi Tarjeta AR</h2>
    <p>Iniciando cámara...</p>
  </div>

  <div id="hint">📸 Apunta la cámara a la tarjeta</div>

  <!-- Slider para ajustar escala en vivo sin tocar el código -->
  <div id="controls">
    <label>Escala: <span id="scaleVal">0.08</span></label>
    <input type="range" id="scaleSlider" min="0.001" max="2" step="0.001" value="0.08">
    <label>Rotar X: <span id="rotXVal">0°</span></label>
    <input type="range" id="rotXSlider" min="-180" max="180" step="1" value="0">
    <label>Rotar Z: <span id="rotZVal">0°</span></label>
    <input type="range" id="rotZSlider" min="-180" max="180" step="1" value="0">
  </div>

  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-image-three';

    const mindarThree = new MindARThree({
      container: document.querySelector('#container'),
      imageTargetSrc: 'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind',
    });

    const { renderer, scene, camera } = mindarThree;
    const anchor = mindarThree.addAnchor(0);

    // ── CUBO DE REFERENCIA (siempre visible al detectar la tarjeta) ──
    // Si ves este cubo rojo → MindAR funciona bien, el problema es solo el .glb
    const cubeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
    const cubeMat = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
    const cube = new THREE.Mesh(cubeGeo, cubeMat);
    cube.position.set(0, 0, 0.05);
    anchor.group.add(cube);
    // ────────────────────────────────────────────────────────────────

    // ── MODELO REAL ──────────────────────────────────────────────────
    let model = null;
    const loader = new GLTFLoader();
    loader.load(
      'MimicruFest.glb',
      (gltf) => {
        model = gltf.scene;
        model.scale.set(0.08, 0.08, 0.08);
        model.position.set(0, 0, 0.05);
        anchor.group.add(model);

        const mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => mixer.clipAction(clip).play());

        const clock = new THREE.Clock();
        renderer.setAnimationLoop(() => {
          mixer.update(clock.getDelta());
          renderer.render(scene, camera);
        });

        // Mostrar controles una vez cargado el modelo
        document.getElementById('controls').style.display = 'flex';

        // Slider de escala
        document.getElementById('scaleSlider').addEventListener('input', (e) => {
          const v = parseFloat(e.target.value);
          document.getElementById('scaleVal').textContent = v.toFixed(3);
          model.scale.set(v, v, v);
        });

        // Slider rotación X
        document.getElementById('rotXSlider').addEventListener('input', (e) => {
          const deg = parseInt(e.target.value);
          document.getElementById('rotXVal').textContent = deg + '°';
          model.rotation.x = deg * Math.PI / 180;
        });

        // Slider rotación Z
        document.getElementById('rotZSlider').addEventListener('input', (e) => {
          const deg = parseInt(e.target.value);
          document.getElementById('rotZVal').textContent = deg + '°';
          model.rotation.z = deg * Math.PI / 180;
        });
      },
      undefined,
      (err) => console.error('Error al cargar el modelo:', err)
    );
    // ─────────────────────────────────────────────────────────────────

    mindarThree.start().then(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('hint').style.display = 'block';
    }).catch((err) => {
      document.querySelector('#loading p').textContent = 'Error: ' + err.message;
    });

  </script>

</body>
</html>
